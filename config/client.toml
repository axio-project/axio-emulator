schema_version = 1

[deployment]
host = 'legacy-unset'
numa_node = 0
role = 'client' # client | server
ssh_port = 22
ssh_user = 'legacy-unset'
use_sudo = true
workdir = '.'

[deployment.topology]
application_workspaces = [ 0, 1, 2, 3 ]
dispatcher_workspaces = [ 0, 1, 2, 3 ]

[handler]
app_ticks_per_message = 0
apply_new_mbuf = false
message_handler = 't_app' # empty | t_app | l_app | m_app | file_write | file_read | key_value
packet_handler = 'empty' # DPDK: empty | echo; RoCE: empty
request_payload_bytes = 982
response_payload_bytes = 22

[knobs.build]
inflight_limit_enabled = true
inflight_messages = 1024
mempool_handler = 'ring_mp_mc' # DPDK: ring_mp_mc | ring_sp_sc | ring_mp_sc | ring_sp_mc | ring_mt_rts | ring_mt_hts | stack | lf_stack | bucket; RoCE: huge_alloc
mtu = 2048 # DPDK: power of two, 64–32768; RoCE: 1024 | 2048 | 4096

[knobs.runtime]
app_rx_batch_size = 16
app_tx_batch_size = 16
application_core_count = 4
dispatcher_queue_count = 4
dispatcher_rx_batch_size = 16
dispatcher_tx_batch_size = 16
nic_rx_post_size = 32
nic_tx_post_size = 16

[metrics]
enabled = true # false disables JSONL, human output, and NIC RX timing instrumentation
human_output = true # false keeps JSONL but suppresses the terminal metrics table
jsonl_path = 'results/axio.jsonl' # one axio.metrics/v1 record per measurement window

[network]
backend = 'dpdk' # dpdk | roce
device_name = 'rocep152s0f0'
device_pcie = '0000:98:00.0'
local_ip = '10.0.2.101'
local_mac = '10:70:fd:6b:93:5c'
physical_port = 0
remote_ip = '10.0.2.102'
remote_mac = '10:70:fd:87:0e:ba'
roce_transport = 'rc' # rc | ud; used only with backend = "roce"
rx_ring_entries = 2048
tx_ring_entries = 2048

[other]
iterations = 30
mempool_cache_size = 512 # DPDK: 0–512; RoCE: must be 0
mempool_size = 8192
window_seconds = 1

[tuning]
infrastructure_failure_limit = 2
latency_slo_us = 100.0
max_iterations = 20
sample_windows = 20
warmup_windows = 10

    [tuning.noise]
    latency_relative_floor = 0.03
    miss_rate_percentage_point_floor = 0.5
    stage_time_relative_floor = 0.05
    stall_time_relative_floor = 0.05
    throughput_relative_floor = 0.01

[[deployment.topology.workloads]]
id = 1
pipeline = [ 'nic_rx', 'dispatcher_rx', 'app_rx', 'app_tx', 'dispatcher_tx', 'nic_tx' ]
remote_dispatchers = [ 0 ]

    [[deployment.topology.workloads.groups]]
    applications = [ 0 ]
    dispatcher = 0

[[deployment.topology.workloads]]
id = 2
pipeline = [ 'nic_rx', 'dispatcher_rx', 'app_rx', 'app_tx', 'dispatcher_tx', 'nic_tx' ]
remote_dispatchers = [ 1 ]

    [[deployment.topology.workloads.groups]]
    applications = [ 1 ]
    dispatcher = 1

[[deployment.topology.workloads]]
id = 3
pipeline = [ 'nic_rx', 'dispatcher_rx', 'app_rx', 'app_tx', 'dispatcher_tx', 'nic_tx' ]
remote_dispatchers = [ 2 ]

    [[deployment.topology.workloads.groups]]
    applications = [ 2 ]
    dispatcher = 2

[[deployment.topology.workloads]]
id = 4
pipeline = [ 'nic_rx', 'dispatcher_rx', 'app_rx', 'app_tx', 'dispatcher_tx', 'nic_tx' ]
remote_dispatchers = [ 3 ]

    [[deployment.topology.workloads.groups]]
    applications = [ 3 ]
    dispatcher = 3

[[deployment.topology.workspaces]]
cpu_core = 0
id = 0

[[deployment.topology.workspaces]]
cpu_core = 1
id = 1

[[deployment.topology.workspaces]]
cpu_core = 2
id = 2

[[deployment.topology.workspaces]]
cpu_core = 3
id = 3
