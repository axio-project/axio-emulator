# Axio configuration schema v1. Unknown keys fail fast. Every listed key is
# required when its table is present; the complete [tuning] tree is optional.
schema_version = 1

# Deployment selects the endpoint role and CPU/host placement needed to launch
# this Axio instance. Role remains compile-time; NUMA placement is runtime.
[deployment]
role = "server"                         # client | server
numa_node = 0
host = "axio-server.example.net"
ssh_port = 22
ssh_user = "axio"
workdir = "/opt/axio-emulator"
use_sudo = true

[deployment.topology]
# Active IDs and inactive candidates, in deterministic add order.
application_workspaces = [4, 5]
dispatcher_workspaces = [0, 1]

# Network contains transport, device, ring, and endpoint identity settings.
# Backend, RoCE transport, and ring sizes require a rebuild; the remaining
# values are consumed at startup.
[network]
backend = "dpdk"                        # dpdk | roce
roce_transport = "rc"                   # rc | ud (used by RoCE)
physical_port = 0
rx_ring_entries = 2048                   # non-zero power of two
tx_ring_entries = 2048                   # non-zero power of two
local_ip = "10.0.0.1"
remote_ip = "10.0.0.2"
local_mac = "10:70:fd:00:00:01"
remote_mac = "10:70:fd:00:00:02"
device_pcie = "0000:98:00.0"
device_name = "mlx5_0"

# Handler describes user-provided application and packet behavior. Every
# handler field is compile-time and participates in the build fingerprint.
[handler]
message_handler = "t_app"                # empty | t_app | l_app | m_app |
                                         # file_write | file_read | key_value
packet_handler = "empty"                 # empty | echo
apply_new_mbuf = false
request_payload_bytes = 982
response_payload_bytes = 22
app_ticks_per_message = 0

# PipeTune rebuild knobs: C4 in-flight, C5 MTU, and C6 memory-pool handler.
[knobs.build]
inflight_limit_enabled = true
inflight_messages = 1024
mtu = 2048
mempool_handler = "ring_mp_mc"            # see README for allowed values

# PipeTune cold-start runtime knobs: C1 core count, C2 queue count, and C3
# batch/post sizes. axio-configure materialize updates the explicit topology
# when C1/C2 change, using the ordered resource pools below.
[knobs.runtime]
application_core_count = 1
dispatcher_queue_count = 1
app_tx_batch_size = 32
app_rx_batch_size = 32
dispatcher_tx_batch_size = 32
dispatcher_rx_batch_size = 32
nic_tx_post_size = 32
nic_rx_post_size = 32

# Emulator lifecycle and supporting memory-pool capacity settings.
[other]
iterations = 30
window_seconds = 1
mempool_size = 8192
mempool_cache_size = 0

# Metrics configure emulator output. The tuning policy below is optional and
# does not own deployment topology.
[metrics]
enabled = true
jsonl_path = "results/axio.jsonl"
human_output = true

[tuning]
max_iterations = 20
latency_slo_us = 100.0
warmup_windows = 10
sample_windows = 20
infrastructure_failure_limit = 2

[tuning.noise]
throughput_relative_floor = 0.01
latency_relative_floor = 0.03
stage_time_relative_floor = 0.05
stall_time_relative_floor = 0.05
miss_rate_percentage_point_floor = 0.5

[[deployment.topology.workloads]]
id = 1
pipeline = ["app_tx", "dispatcher_tx", "nic_tx", "nic_rx",
            "dispatcher_rx", "app_rx"]
remote_dispatchers = [0]

[[deployment.topology.workloads.groups]]
dispatcher = 0
applications = [4]

[[deployment.topology.workspaces]]
id = 0
cpu_core = 0                            # NUMA-local core ordinal

[[deployment.topology.workspaces]]
id = 4
cpu_core = 4

[[deployment.topology.workspaces]]
id = 1
cpu_core = 1

[[deployment.topology.workspaces]]
id = 5
cpu_core = 5
