    [[deployment.topology.workloads.groups]]
    applications = [ 5 ]
    dispatcher = 5

    [[deployment.topology.workloads.groups]]
    applications = [ 6 ]
    dispatcher = 6

    [[deployment.topology.workloads.groups]]
    applications = [ 7 ]
    dispatcher = 7

